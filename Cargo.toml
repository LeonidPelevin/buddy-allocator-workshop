[package]
name = "buddy_allocator_workshop"
version = "0.1.0"
authors = ["restioson <restiosondev@gmail.com>"]
# `edition = "2015"` is set to silence Cargo's warning about an unspecified
# edition. It does not change allocator behaviour; it's only here so `cargo`
# stops printing the "package.edition is unspecified" reminder on build.
edition = "2015"

[dependencies]
static_assertions = "0.2.5"
structopt = "0.2.5"
array-init = "0.0.2"
failure = "0.1.1"
intrusive-collections = "0.7.0"
bit_field = "0.9.0"
flame = { version = "0.2.0", optional = true }
flamer = { version = "^0.2.0", optional = true }

[features]
default = []
flame_profile = ["flame", "flamer"]

[dev-dependencies]
criterion = "0.2"

[[bench]]
name = "rb_tree"
harness = false

# The benches above declare custom benchmarks for the crate's allocator
# implementations. `harness = false` means Criterion (or `cargo bench`) will
# run these as standalone binaries with their own `main`/entry; these are not
# the Rust test harness style benches. They exercise the different allocator
# backends (rb_tree, bitmap) using the demo harness in `src/main.rs`.

[[bench]]
name = "bitmap"
harness = false

[profile.release]
debug = true